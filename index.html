<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Persistent To-Do Application</title>
    <meta name="description" content="A professional, feature-rich persistent task manager application with categories, priorities, due dates, search filtering, and LocalStorage synchronization.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <polyline points="9 11 11 13 15 9"></polyline>
                        <line x1="9" y1="17" x2="15" y2="17"></line>
                    </svg>
                </div>
                <h1 class="brand-title">Task <span class="highlight">Manager</span></h1>
            </div>

            <!-- Header Actions -->
            <div class="header-actions">
                <!-- Theme Toggle Button -->
                <button class="icon-btn" id="btn-theme-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
                    <svg class="sun-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </header>

        <!-- Progress Overview Bar -->
        <section class="progress-section">
            <div class="progress-info">
                <span class="progress-title">Overall Progress</span>
                <span class="progress-percent" id="progress-percent-text">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
        </section>

        <!-- Task Creation Card -->
        <section class="card creation-card">
            <h2 class="card-title">Create New Task</h2>
            <form id="task-form" class="task-form">
                <div class="form-main-row">
                    <input type="text" id="task-input-title" placeholder="What needs to be done?" required autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="btn-add-task">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>Add Task</span>
                    </button>
                </div>

                <div class="form-options-row">
                    <!-- Category Select -->
                    <div class="form-field">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="Work">💼 Work</option>
                            <option value="Personal" selected>👤 Personal</option>
                            <option value="Study">📚 Study</option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Health">🩺 Health</option>
                        </select>
                    </div>

                    <!-- Priority Select -->
                    <div class="form-field">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>

                    <!-- Due Date Input -->
                    <div class="form-field">
                        <label for="task-duedate">Due Date</label>
                        <input type="date" id="task-duedate">
                    </div>
                </div>
            </form>
        </section>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar">
            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All</button>
                <button class="tab-btn" data-filter="active">Active</button>
                <button class="tab-btn" data-filter="completed">Completed</button>
            </div>

            <div class="toolbar-controls">
                <!-- Search Box -->
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>

                <!-- Category Filter -->
                <select id="filter-category" title="Filter by Category">
                    <option value="all">All Categories</option>
                    <option value="Work">💼 Work</option>
                    <option value="Personal">👤 Personal</option>
                    <option value="Study">📚 Study</option>
                    <option value="Shopping">🛒 Shopping</option>
                    <option value="Health">🩺 Health</option>
                </select>

                <!-- Sort Selector -->
                <select id="sort-select" title="Sort Tasks">
                    <option value="newest">Sort: Newest</option>
                    <option value="oldest">Sort: Oldest</option>
                    <option value="priority">Sort: Priority</option>
                    <option value="duedate">Sort: Due Date</option>
                </select>
            </div>
        </section>

        <!-- Task List Area -->
        <main class="tasks-container">
            <ul id="task-list" class="task-list">
                <!-- Dynamic task items injected via script.js -->
            </ul>
        </main>

        <!-- Dashboard Stats Footer -->
        <footer class="app-footer">
            <div class="stats-counter">
                <span class="stat-item">Total: <strong id="stat-total">0</strong></span>
                <span class="stat-item">Pending: <strong id="stat-pending">0</strong></span>
                <span class="stat-item">Completed: <strong id="stat-completed">0</strong></span>
            </div>

            <div class="footer-actions">
                <button class="btn-sm btn-danger" id="btn-clear-completed" disabled>Clear Completed</button>
                <button class="btn-sm btn-secondary" id="btn-clear-all" disabled>Clear All</button>
            </div>
        </footer>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal-backdrop hidden" id="edit-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="icon-btn-close" id="btn-modal-close">&times;</button>
            </div>
            <form id="edit-form" class="modal-body">
                <div class="form-field">
                    <label for="edit-title">Task Title</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-options-row">
                    <div class="form-field">
                        <label for="edit-category">Category</label>
                        <select id="edit-category">
                            <option value="Work">💼 Work</option>
                            <option value="Personal">👤 Personal</option>
                            <option value="Study">📚 Study</option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Health">🩺 Health</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="edit-priority">Priority</label>
                        <select id="edit-priority">
                            <option value="low">🟢 Low</option>
                            <option value="medium">🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="edit-duedate">Due Date</label>
                        <input type="date" id="edit-duedate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-edit-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
